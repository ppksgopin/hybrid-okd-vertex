# configuration/instance-setting.yaml

cluster_domain: okd-lab.example.com
# ⚠️ 注意：請依據 OKD 官方 GitHub Releases 填入 4.18 的確切版本號
# 例如: "4.18.0-0.okd-scos-..."
okd_version: "4.18.0-okd-scos.10"

bareMachine:
  hosts:
    - hostname: lab1
      ip: 10.42.0.201
    - hostname: lab2
      ip: 10.42.0.202

bootstrap:
  vm_name: bootstrap-01
  vm_ip: 10.42.0.209
  vm_cpu: 8
  vm_memory: 16384
  vm_disk_size: 100
  vm_mac: "52:54:00:aa:bb:cc"
  target_host: lab2

controlNodes:
  interface_bridge: br0
  hosts:
    - vm_name: control-01
      vm_ip: 10.42.0.210
      vm_cpu: 8
      vm_memory: 16384
      vm_disk_size: 100
      vm_mac: "52:54:00:11:22:33"
      target_host: lab1

workNodes:
  onPremises:
    interface_bridge: br0
    hosts:
      # 🚀 升級調整：為應付 OADP、Loki 與 GitOps，將 RAM 從 8192 提升至 12288 (12GB) 或更高
      - vm_name: worker-01
        vm_ip: 10.42.0.211
        vm_cpu: 4
        vm_memory: 12288
        vm_disk_size: 100
        vm_mac: "52:54:00:44:55:66"
        target_host: lab2

      - vm_name: worker-02
        vm_ip: 10.42.0.212
        vm_cpu: 4
        vm_memory: 12288
        vm_disk_size: 100
        vm_mac: "52:54:00:77:88:99"
        target_host: lab2