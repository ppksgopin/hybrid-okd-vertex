apiVersion: v1
kind: Pod
metadata:
  name: dev-tools
  namespace: coding
  labels:
    app: coding-tools
spec:
  containers:
    - name: go-container
      image: golang:1.23
      command: ["sleep", "infinity"]
      resources:
        requests:
          memory: "128Mi"
          cpu: "100m"
        limits:
          memory: "512Mi"
          cpu: "500m"

    - name: python-container
      image: python:3.11-slim
      command: ["sleep", "infinity"]
      resources:
        requests:
          memory: "128Mi"
          cpu: "100m"
        limits:
          memory: "512Mi"
          cpu: "500m"