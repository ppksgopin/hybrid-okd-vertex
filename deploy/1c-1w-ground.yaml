---

# =====================================================================
# 🚀 戰役零：Ansible 控制器本地全自動冷啟動 (身分證製備)
# =====================================================================
- name: "【戰役零】在 Ansible 控制器本地烘焙身分證"
  hosts: localhost
  gather_facts: no

  tasks:
    - name: "🚀 引入外部身分證自動生成任務"
      ansible.builtin.include_tasks: generate-ignition.yaml


# =====================================================================
# 🚀 專案一：hybrid-okd-vertex (全新純淨裸機一鍵開墾版)
# =====================================================================

# ---------------------------------------------------------------------
# 【戰役一】初始化 lab1 網路中心 (Docker & dnsmasq) - 保持不變
# ---------------------------------------------------------------------
- name: "【戰役一】在 lab1 部署容器化 dnsmasq"
  hosts: lab1
  gather_facts: no
  become: true
  vars_files:
    - ../configuration/instance-setting.yaml

  tasks:
    - name: "1. 停止並停用 systemd-resolved 服務"
      ansible.builtin.systemd:
        name: systemd-resolved
        state: stopped
        enabled: false
      failed_when: false

    - name: "2. 重置 resolv.conf 確保能連外網"
      ansible.builtin.copy:
        dest: /etc/resolv.conf
        content: "nameserver 8.8.8.8\n"
        mode: '0644'

    - name: "3. 建立 dnsmasq 配置持久化目錄"
      ansible.builtin.file:
        path: /opt/okd-infra
        state: directory
        mode: '0755'

    - name: "4. 寫入 dnsmasq.conf 設定檔"
      ansible.builtin.copy:
        dest: /opt/okd-infra/dnsmasq.conf
        mode: '0644'
        content: |
          interface={{ controlNodes.interface_bridge }}
          bind-interfaces
          domain=example.com
          server=8.8.8.8
          host-record=api.{{ cluster_domain }},{{ controlNodes.hosts[0].vm_ip }}
          host-record=api-int.{{ cluster_domain }},{{ controlNodes.hosts[0].vm_ip }}
          address=/.apps.{{ cluster_domain }}/{{ controlNodes.hosts[0].vm_ip }}
          dhcp-range=10.42.0.210,10.42.0.215,255.255.255.0,12h
          dhcp-host={{ controlNodes.hosts[0].vm_mac }},{{ controlNodes.hosts[0].vm_ip }},control,infinite
          dhcp-host={{ workNodes.hosts[0].vm_mac }},{{ workNodes.hosts[0].vm_ip }},worker,infinite
          dhcp-option=option:router=10.42.0.1
          dhcp-option=option:dns-server=10.42.0.201

    - name: "5. 在 lab1 拉起 dnsmasq 容器"
      community.docker.docker_container:
        name: okd-net-center
        image: jpillora/dnsmasq
        state: started
        restart_policy: always
        network_mode: host
        capabilities:
          - NET_ADMIN
        volumes:
          - /opt/okd-infra/dnsmasq.conf:/etc/dnsmasq.conf

# ---------------------------------------------------------------------
# 【戰役二】在 lab1 自動下載標準 ISO 並建立 KVM 大腦虛擬機
# ---------------------------------------------------------------------
- name: "【戰役二】在 lab1 建立並啟動 OKD 大腦虛擬機"
  hosts: lab1
  gather_facts: no
  become: true
  vars_files:
    - ../configuration/instance-setting.yaml

  tasks:
    - name: "1.5 🛡️ 解除 AppArmor/SELinux 限制：允許 QEMU 讀取自訂外掛韌體"
      ansible.builtin.lineinfile:
        path: /etc/libvirt/qemu.conf
        regexp: '^#?\s*security_driver\s*=\s*.*'
        line: 'security_driver = "none"'
      register: qemu_security_config

    - name: "1.6 🔄 重啟 libvirtd 服務以強制套用安全設定"
      ansible.builtin.systemd:
        name: libvirtd
        state: restarted
      when: qemu_security_config.changed

    - name: "2. 📥 自動下載官方標準 Fedora CoreOS Live ISO"
      ansible.builtin.get_url:
        url: "https://builds.coreos.fedoraproject.org/prod/streams/stable/builds/41.20241109.3.0/x86_64/fedora-coreos-41.20241109.3.0-live.x86_64.iso"
        dest: /var/lib/libvirt/images/fcos-live.iso
        mode: '0644'

    - name: "3. 🛸 把筆電容器裡的 master.ign 身分證上傳到 lab1"
      ansible.builtin.copy:
        src: ../templates/master.ign
        dest: /var/lib/libvirt/images/master.ign
        mode: '0644'

    - name: "3.5a 📁 原生模組：在 Libvirt 中登記 (Define) default 儲存池"
      community.libvirt.virt_pool:
        name: default
        state: present
        xml: |
          <pool type='dir'>
            <name>default</name>
            <target>
              <path>/var/lib/libvirt/images</path>
            </target>
          </pool>

    - name: "3.5b 📁 原生模組：激活 (Start) 並設定開機自啟 default 儲存池"
      community.libvirt.virt_pool:
        name: default
        state: active # 🎯 關鍵修正：確認註冊後，再行激活並鎖定開機自啟
        autostart: yes

    - name: "4. 🛠️ 建立虛擬機的 QCOW2 空白系統硬碟 (具備完備冪等性)"
      ansible.builtin.command:
        cmd: "qemu-img create -f qcow2 /var/lib/libvirt/images/{{ controlNodes.hosts[0].vm_name }}.qcow2 {{ controlNodes.hosts[0].vm_disk_size }}G"
        creates: "/var/lib/libvirt/images/{{ controlNodes.hosts[0].vm_name }}.qcow2" # 🎯 核心防線：如果檔案已存在，Ansible 會自動跳過此任務，絕不報錯或覆寫

    - name: "5. 📝 原生模組：利用 XML 範本定義並直接啟動虛擬機"
      community.libvirt.virt:
        name: "{{ controlNodes.hosts[0].vm_name }}"
        command: define
        xml: "{{ lookup('template', '../templates/kvm-vm.xml.j2') }}"
        autostart: true

    - name: "6. ⚡ 原生模組：確保虛擬機立刻開機執行"
      community.libvirt.virt:
        name: "{{ controlNodes.hosts[0].vm_name }}"
        state: running


