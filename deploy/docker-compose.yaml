
services:
  dnsmasq:
    image: jpillora/dnsmasq
    container_name: bastion-dnsmasq
    network_mode: host
    cap_add:
      - NET_ADMIN
    # 🎯 徹底覆寫 entrypoint，完全拋棄 webproc，只執行純粹的 dnsmasq
    entrypoint: ["dnsmasq", "-k", "--log-facility=-"]
    volumes:
      - ./dnsmasq.conf:/etc/dnsmasq.conf:ro
    restart: always

  haproxy:
    image: haproxy:2.8-alpine
    container_name: bastion-haproxy
    network_mode: host
    user: root
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    restart: always
