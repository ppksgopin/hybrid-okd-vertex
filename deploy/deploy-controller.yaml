---

# =====================================================================
# 🚀 戰役零：Ansible 控制器本地全自動冷啟動 (身分證製備)
# =====================================================================
- name: "【戰役零】在 Ansible 控制器本地烘焙身分證"
  hosts: localhost
  gather_facts: no

  tasks:
    - name: "🚀 引入外部身分證自動生成任務"
      ansible.builtin.include_tasks: generate-ignition.yaml


# =====================================================================
# 🚀 專案一：hybrid-okd-vertex (全新純淨裸機一鍵開墾版)
# =====================================================================

# ---------------------------------------------------------------------
# 【戰役一】初始化 bastion 網路中心 (Docker & dnsmasq) - 保持不變
# ---------------------------------------------------------------------
- name: "【戰役一】在 bastion 部署 Bastion 網管中心"
  hosts: lab1
  gather_facts: no
  become: true
  vars_files:
    - ../configuration/instance-setting.yaml

  tasks:
    - name: "1. 停止並停用 systemd-resolved 服務 (避免 port 53 衝突)"
      ansible.builtin.systemd:
        name: systemd-resolved
        state: stopped
        enabled: false
      failed_when: false

    - name: "2. 移除 resolv.conf 軟連結 (避免寫入到無效的 systemd 目標)"
      ansible.builtin.file:
        path: /etc/resolv.conf
        state: absent

    - name: "2.1 重置 resolv.conf 確保實體機能連外網"
      ansible.builtin.copy:
        dest: /etc/resolv.conf
        content: "nameserver 8.8.8.8\n"
        mode: '0644'

    - name: "2.2 重新啟動 Docker 服務以套用新的 DNS 設定"
      ansible.builtin.systemd:
        name: docker
        state: restarted

    - name: "3. 建立 Bastion 專屬配置目錄"
      ansible.builtin.file:
        path: /opt/okd-infra
        state: directory
        mode: '0755'

    - name: "4. 📝 渲染並寫入 dnsmasq.conf 設定檔"
      ansible.builtin.template:
        src: ../templates/dnsmasq.conf.j2
        dest: /opt/okd-infra/dnsmasq.conf
        mode: '0644'

    - name: "5. 📝 渲染並寫入 haproxy.cfg 設定檔"
      ansible.builtin.template:
        src: ../templates/haproxy.cfg.j2
        dest: /opt/okd-infra/haproxy.cfg
        mode: '0644'

    - name: "6. 📦 複製 docker-compose.yaml 到 bastion"
      ansible.builtin.copy:
        src: docker-compose.yaml
        dest: /opt/okd-infra/docker-compose.yaml
        mode: '0644'

    - name: "6.5 🛠️ 預先拉取 Docker Images (加入重試機制避免網路抖動)"
      community.docker.docker_image:
        name: "{{ item }}"
        source: pull
      loop:
        - "jpillora/dnsmasq:latest"
        - "haproxy:2.8-alpine"
      register: pull_result
      retries: 5
      delay: 5
      until: pull_result is not failed

    - name: "7. 🚀 在 bastion 啟動 Bastion 雙擎 (Docker Compose)"
      community.docker.docker_compose_v2:
        project_src: /opt/okd-infra
        state: present

# ---------------------------------------------------------------------
# 【戰役二】自動下載標準 ISO 並建立 KVM 大腦虛擬機
# ---------------------------------------------------------------------
- name: "【戰役二】在實體機建立並啟動 OKD 大腦虛擬機"
  hosts: onPremises
  gather_facts: no
  become: false  # <--- 關閉全域提權，改為用一般使用者 ppksgopin 執行
  vars_files:
    - ../configuration/instance-setting.yaml

  tasks:
    - name: "1.5 🛡️ 解除 AppArmor/SELinux 限制：允許 QEMU 讀取自訂外掛韌體 (需要 root 權限)"
      become: true
      ansible.builtin.lineinfile:
        path: /etc/libvirt/qemu.conf
        regexp: '^#?\s*security_driver\s*=\s*.*'
        line: 'security_driver = "none"'
      register: qemu_security_config

    - name: "1.6 🔄 重啟 libvirtd 服務以強制套用安全設定 (需要 root 權限)"
      become: true
      ansible.builtin.systemd:
        name: libvirtd
        state: restarted
      when: qemu_security_config.changed

    - name: "1.9 🔍 動態向 openshift-install 詢問最匹配的 SCOS 映像檔網址"
      delegate_to: localhost
      ansible.builtin.command: "{{ playbook_dir }}/../_build_ign/openshift-install coreos print-stream-json"
      register: coreos_stream_json
      changed_when: false

    - name: "1.10 🧠 解析 SCOS 下載網址 (自動相容 xz 與 gz 格式)"
      ansible.builtin.set_fact:
        scos_qcow2_url: >-
          {{
            (coreos_stream_json.stdout | from_json).architectures.x86_64.artifacts.qemu.formats['qcow2.xz'].disk.location
            | default((coreos_stream_json.stdout | from_json).architectures.x86_64.artifacts.qemu.formats['qcow2.gz'].disk.location)
          }}

    - name: "2. 📥 自動下載官方 SCOS QEMU 映像檔"
      ansible.builtin.get_url:
        url: "{{ scos_qcow2_url }}"
        dest: /tmp/scos.qcow2.archive # 統一暫存檔名
        mode: '0644'

    - name: "2.1 📦 智慧解壓縮 SCOS 映像檔 (保留 fcos.qcow2 檔名以相容後續腳本)"
      become: true
      ansible.builtin.shell: |
        if [[ "{{ scos_qcow2_url }}" == *.gz ]]; then
          zcat /tmp/scos.qcow2.archive > /var/lib/libvirt/images/fcos.qcow2
        elif [[ "{{ scos_qcow2_url }}" == *.xz ]]; then
          unxz -k -c /tmp/scos.qcow2.archive > /var/lib/libvirt/images/fcos.qcow2
        else
          echo "未知的壓縮格式" && exit 1
        fi
      args:
        creates: /var/lib/libvirt/images/fcos.qcow2

    - name: "3. 🛸 把身分證上傳到實體機 (Master & Bootstrap) (需要 root 權限寫入 /var/lib/libvirt/images)"
      become: true
      ansible.builtin.copy:
        src: "../templates/{{ item }}"
        dest: "/var/lib/libvirt/images/{{ item }}"
        mode: '0644'
      loop:
        - master.ign
        - bootstrap.ign

    # --- Bootstrap 專區 ---
    - name: "4. 🛠️ 建立 Bootstrap 虛擬機專屬硬碟 (需要 root 權限)"
      become: true
      ansible.builtin.command:
        cmd: "qemu-img create -f qcow2 -F qcow2 -b /var/lib/libvirt/images/fcos.qcow2 /var/lib/libvirt/images/{{ bootstrap.vm_name }}.qcow2 {{ bootstrap.vm_disk_size }}G"
      args:
        creates: "/var/lib/libvirt/images/{{ bootstrap.vm_name }}.qcow2"
      when: "bootstrap.target_host == inventory_hostname"

    - name: "4.1 🛠️ 批次建立 Control Node 虛擬機專屬硬碟 (需要 root 權限)"
      become: true
      ansible.builtin.command:
        cmd: "qemu-img create -f qcow2 -F qcow2 -b /var/lib/libvirt/images/fcos.qcow2 /var/lib/libvirt/images/{{ item.vm_name }}.qcow2 {{ item.vm_disk_size }}G"
      args:
        creates: "/var/lib/libvirt/images/{{ item.vm_name }}.qcow2"
      loop: "{{ controlNodes.hosts }}"
      when: "item.target_host == inventory_hostname"

    - name: "5. 🔐 設定基礎映像檔與身分證的存取權限 (開放給 libvirt-qemu 與 ppksgopin)"
      become: true
      ansible.builtin.file:
        path: "/var/lib/libvirt/images/{{ item }}"
        owner: libvirt-qemu
        group: ppksgopin
        mode: '0664'
      loop:
        - fcos.qcow2
        - master.ign
        - bootstrap.ign

    - name: "5.0 🔐 設定 Bootstrap 虛擬硬碟存取權限"
      become: true
      ansible.builtin.file:
        path: "/var/lib/libvirt/images/{{ bootstrap.vm_name }}.qcow2"
        owner: libvirt-qemu
        group: ppksgopin
        mode: '0664'
      when: "bootstrap.target_host == inventory_hostname"

    - name: "5.1 🔐 批次設定 Control Node 虛擬硬碟存取權限 (開放給 libvirt-qemu 與 ppksgopin)"
      become: true
      ansible.builtin.file:
        path: "/var/lib/libvirt/images/{{ item.vm_name }}.qcow2"
        owner: libvirt-qemu
        group: ppksgopin
        mode: '0664'
      loop: "{{ controlNodes.hosts }}"
      when: "item.target_host == inventory_hostname"

    - name: "5.3 🛡️ 設定 QEMU Bridge Helper 的存取權限 (允許 ppksgopin 透過 bridge 連網)"
      become: true
      ansible.builtin.file:
        path: /usr/lib/qemu/qemu-bridge-helper
        mode: 'u+s' # 設定 SUID，讓這個小幫手能以 root 權限執行橋接

    - name: "5.4 🛡️ 配置 qemu-bridge-helper 的 ACL 白名單"
      become: true
      ansible.builtin.copy:
        dest: /etc/qemu/bridge.conf
        content: |
          allow br0
          allow all
        mode: '0644'
        directory_mode: '0755'

    - name: "6. 📝 定義 Bootstrap 虛擬機 (使用 ppksgopin 的 qemu:///session)"
      community.libvirt.virt:
        uri: 'qemu:///session'
        name: "{{ bootstrap.vm_name }}"
        command: define
        xml: "{{ lookup('template', '../templates/bootstrap.xml.j2') }}"
        autostart: true
      when: "bootstrap.target_host == inventory_hostname"

    - name: "7. ⚡ 啟動 Bootstrap 虛擬機 (使用 ppksgopin 的 qemu:///session)"
      community.libvirt.virt:
        uri: 'qemu:///session'
        name: "{{ bootstrap.vm_name }}"
        state: running
      when: "bootstrap.target_host == inventory_hostname"

    - name: "6.1 📝 批次定義 Control Node 虛擬機 (使用 ppksgopin 的 qemu:///session)"
      community.libvirt.virt:
        uri: 'qemu:///session'
        name: "{{ item.vm_name }}"
        command: define
        # 把 item 傳進去給 template 渲染
        xml: "{{ lookup('template', '../templates/control.xml.j2', template_vars={'item': item}) }}"
        autostart: true
      loop: "{{ controlNodes.hosts }}"
      when: "item.target_host == inventory_hostname"

    - name: "7.1 ⚡ 批次啟動 Control Node 虛擬機 (使用 ppksgopin 的 qemu:///session)"
      community.libvirt.virt:
        uri: 'qemu:///session'
        name: "{{ item.vm_name }}"
        state: running
      loop: "{{ controlNodes.hosts }}"
      when: "item.target_host == inventory_hostname"
