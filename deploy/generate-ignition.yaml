# =====================================================================
# 🎯 拋棄式任務：在 Ansible 容器內部原地烘焙 OKD 身分證 (Ignition)
# =====================================================================

- name: "0.0 📂 讀取叢集基礎架構設定變數"
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/../configuration/instance-setting.yaml"

- name: "0.1 📂 建立本地暫存工作區"
  ansible.builtin.file:
    path: "{{ playbook_dir }}/../_build_ign"
    state: directory
    mode: '0755'

- name: "0.1.1 🔍 自動尋找並讀取容器內的 SSH Public Key"
  ansible.builtin.set_fact:
    cluster_ssh_key: "{{ lookup('file', item) }}"
  with_first_found:
    - files:
        - /root/.ssh/id_ed25519.pub
        - /root/.ssh/id_rsa.pub
        - /root/.ssh/id_ecdsa.pub
      skip: true

- name: "0.2 📝 寫入 install-config.yaml 核心規格書 (動態節點數量與 SSH Key)"
  ansible.builtin.copy:
    dest: "{{ playbook_dir }}/../_build_ign/install-config.yaml"
    mode: '0644'
    content: |
      apiVersion: v1
      baseDomain: {{ cluster_domain.split('.', 1)[1] if '.' in cluster_domain else 'example.com' }}
      metadata:
        name: {{ cluster_domain.split('.')[0] if '.' in cluster_domain else 'okd-lab' }}
      compute:
      - hyperthreading: Enabled
        name: worker
        replicas: {{ workNodes.onPremises.hosts | length | default(0) }}
      controlPlane:
        hyperthreading: Enabled
        name: master
        replicas: {{ controlNodes.hosts | length | default(1) }}
      platform:
        none: {}
      pullSecret: '{"auths":{"fake":{"auth":"aG9nZf=="}}}'
      sshKey: '{{ cluster_ssh_key | default("") | trim }}'

- name: "0.3 📥 下載並解壓 OKD 官方核心安裝工具"
  ansible.builtin.unarchive:
    src: "https://github.com/okd-project/okd/releases/download/{{ okd_version }}/openshift-install-linux-{{ okd_version }}.tar.gz"
    dest: "{{ playbook_dir }}/../_build_ign"
    remote_src: yes # 告訴 Ansible 這是從網路上抓，直接在容器內解壓

- name: "0.4 ⚡ 執行官方指令，將規格書轉化為身分證"
  ansible.builtin.command:
    cmd: "./openshift-install create ignition-configs --dir={{ playbook_dir }}/../_build_ign"
  args:
    chdir: "{{ playbook_dir }}/../_build_ign"

# ✨ 新增：下載 4.14 的 oc client 工具
- name: "0.5 📥 下載並解壓 OKD 官方用戶端工具 (oc CLI)"
  ansible.builtin.unarchive:
    src: "https://github.com/okd-project/okd/releases/download/{{ okd_version }}/openshift-client-linux-{{ okd_version }}.tar.gz"
    dest: "{{ playbook_dir }}/../_build_ign"
    remote_src: yes

# ✨ 修改後：同時覆蓋 /usr/bin 與 /usr/local/bin，徹底消滅 4.15 幽靈
- name: "0.6 👑 強力覆蓋容器內的系統 oc 與 kubectl 工具"
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../_build_ign/{{ item.binary }}"
    dest: "{{ item.path }}/{{ item.binary }}"
    mode: '0755'
    remote_src: yes
  loop:
    - { binary: 'oc', path: '/usr/bin' }
    - { binary: 'oc', path: '/usr/local/bin' }
    - { binary: 'kubectl', path: '/usr/bin' }
    - { binary: 'kubectl', path: '/usr/local/bin' }
  ignore_errors: yes # 防止有些精簡版容器本來就沒有 /usr/local/bin 而噴錯

# =====================================================================
# ✨ 【神來一筆】: 自動配置 Kubeconfig 預設路徑，省去手動 export 的麻煩
# =====================================================================
- name: "0.6.1 🔐 建立容器預設 Kubeconfig 目錄"
  ansible.builtin.file:
    path: "/root/.kube"
    state: directory
    mode: '0700'

- name: "0.6.2 🔑 複製憑證至預設路徑，讓 oc 指令免設定直接通關"
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../_build_ign/auth/kubeconfig"
    dest: "/root/.kube/config"
    mode: '0600'
    remote_src: yes

- name: "0.7 🛸 將生成的 DNA 身分證移至專案根目錄 (透過掛載自動同步回筆電)"
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../_build_ign/{{ item }}"
    dest: "{{ playbook_dir }}/../templates/{{ item }}"
    mode: '0644'
    remote_src: yes
  loop:
    - bootstrap.ign
    - master.ign
    - worker.ign

- name: "0.7.1 🧹 清除 _build_ign 原始檔案"
  ansible.builtin.file:
    path: "{{ playbook_dir }}/../_build_ign/{{ item }}"
    state: absent
  loop:
    - bootstrap.ign
    - master.ign
    - worker.ign

- name: "0.8 📝 幫 Ansible 容器寫小抄 (解決 DNS 解析問題)"
  ansible.builtin.shell: |
    echo "{{ bareMachine.hosts[0].ip }} api.{{ cluster_domain }}" | tee -a /etc/hosts
  changed_when: false
