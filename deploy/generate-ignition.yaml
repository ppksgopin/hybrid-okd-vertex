---
# =====================================================================
# 🎯 拋棄式任務：在 Ansible 容器內部原地烘焙 OKD 身分證 (Ignition)
# =====================================================================

- name: "0.0 📂 讀取叢集基礎架構設定變數"
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/../configuration/instance-setting.yaml"

- name: "0.1 📂 建立本地暫存工作區"
  ansible.builtin.file:
    path: "{{ playbook_dir }}/../_build_ign"
    state: directory
    mode: '0755'

- name: "0.2 📝 寫入 install-config.yaml 核心規格書 (動態節點數量)"
  ansible.builtin.copy:
    dest: "{{ playbook_dir }}/../_build_ign/install-config.yaml"
    mode: '0644'
    content: |
      apiVersion: v1
      baseDomain: example.com
      metadata:
        name: okd-lab
      compute:
      - hyperthreading: Enabled
        name: worker
        replicas: {{ workNodes.hosts | length | default(0) }}
      controlPlane:
        hyperthreading: Enabled
        name: master
        replicas: {{ controlNodes.hosts | length | default(1) }}
      platform:
        none: {}
      pullSecret: '{"auths":{"fake":{"auth":"aG9nZf=="}}}'
      sshKey: 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICO6j3RqNSmQ8SOrTw/6ZOBlXn/EJ5ew/byDglbuUa1m ppksgopin@lenovo-master'

- name: "0.3 📥 下載並解壓 OKD 官方核心安裝工具"
  ansible.builtin.unarchive:
    src: "https://github.com/okd-project/okd/releases/download/4.15.0-0.okd-2024-03-10-010116/openshift-install-linux-4.15.0-0.okd-2024-03-10-010116.tar.gz"
    dest: "{{ playbook_dir }}/../_build_ign"
    remote_src: yes # 告訴 Ansible 這是從網路上抓，直接在容器內解壓

- name: "0.4 ⚡ 執行官方指令，將規格書轉化為身分證"
  ansible.builtin.command:
    cmd: "./openshift-install create ignition-configs --dir={{ playbook_dir }}/../_build_ign"
  args:
    chdir: "{{ playbook_dir }}/../_build_ign"

- name: "0.5 🛸 將生成的 DNA 身分證移至專案根目錄 (透過掛載自動同步回筆電)"
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../_build_ign/{{ item }}"
    dest: "{{ playbook_dir }}/../templates/{{ item }}"
    mode: '0644'
    remote_src: yes
  loop:
    - bootstrap.ign
    - master.ign
    - worker.ign
