---
- name: "【任務 A】在筆電本地端等待 OKD 官方的拆除許可"
  hosts: localhost
  gather_facts: no
  vars_files:
    - ../configuration/instance-setting.yaml

  tasks:
    - name: "1. ⏳ 等待 Bootstrap 完成 (加入重試迴圈突破 20 分鐘硬超時限制)"
      ansible.builtin.command:
        chdir: "{{ playbook_dir }}/../_build_ign"
        cmd: "./openshift-install wait-for bootstrap-complete --dir=. --log-level=info"
      register: bootstrap_wait
      # -------------------------------------------------------------------
      # 🎯 破解超時的核心：Ansible 自動重試機制
      # -------------------------------------------------------------------
      until: bootstrap_wait.rc == 0   # 只要 rc != 0 (例如超時退出)，就自動重啟指令
      retries: 4                      # 最多重試 4 次 (20 分鐘 x 5 輪 = 總共允許等待 100 分鐘)
      delay: 10                       # 每次超時後，間隔 10 秒立刻發起下一輪等待
      changed_when: false

    - name: "2. 🖨️ 印出官方確認訊息"
      ansible.builtin.debug:
        var: bootstrap_wait.stdout_lines

    - name: "3. ⏳ 等待 10 分鐘"
      ansible.builtin.pause:
        minutes: 7

- name: "【任務 B】在 lab1 執行毀滅與網管中心更新"
  hosts: lab1
  gather_facts: no
  become: false  # <--- 關閉全域提權，與建立時保持一致，使用 ppksgopin 身分
  vars_files:
    - ../configuration/instance-setting.yaml
  vars:
    # 🎯 關鍵：關閉魔法開關！這會讓 HAProxy 設定檔自動剔除 Bootstrap
    enable_bootstrap: false

  tasks:
    - name: "3. 💀 強制關閉 Bootstrap 虛擬機 (使用 ppksgopin 的 qemu:///session)"
      community.libvirt.virt:
        uri: 'qemu:///session'
        name: "{{ bootstrap.vm_name }}"
        state: destroyed
      ignore_errors: yes

    - name: "4. 🗑️ 徹底刪除 Bootstrap 虛擬機定義 (使用 ppksgopin 的 qemu:///session)"
      community.libvirt.virt:
        uri: 'qemu:///session'
        name: "{{ bootstrap.vm_name }}"
        command: undefine
      ignore_errors: yes

    - name: "5. 🧹 刪除 Bootstrap 專屬 100G 虛擬硬碟 (需要 root 權限，因為在 /var/lib/libvirt/images)"
      become: true
      ansible.builtin.file:
        path: "/var/lib/libvirt/images/{{ bootstrap.vm_name }}.qcow2"
        state: absent

    - name: "6. 📝 重新渲染 haproxy.cfg (此時已無 Bootstrap) (需要 root 權限寫入 /opt/okd-infra)"
      become: true
      ansible.builtin.template:
        src: ../templates/haproxy.cfg.j2
        dest: /opt/okd-infra/haproxy.cfg
        mode: '0644'

    - name: "7. 🔄 重啟 HAProxy 容器以套用新設定 (需要 root 權限或 docker 群組，保險起見使用 root)"
      become: true
      community.docker.docker_compose_v2:
        project_src: /opt/okd-infra
        state: restarted
        services:
          - haproxy
