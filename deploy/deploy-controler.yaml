---

# =====================================================================
# 🚀 戰役零：Ansible 控制器本地全自動冷啟動 (身分證製備)
# =====================================================================
- name: "【戰役零】在 Ansible 控制器本地烘焙身分證"
  hosts: localhost
  gather_facts: no

  tasks:
    - name: "🚀 引入外部身分證自動生成任務"
      ansible.builtin.include_tasks: generate-ignition.yaml


# =====================================================================
# 🚀 專案一：hybrid-okd-vertex (全新純淨裸機一鍵開墾版)
# =====================================================================

# ---------------------------------------------------------------------
# 【戰役一】初始化 lab1 網路中心 (Docker & dnsmasq) - 保持不變
# ---------------------------------------------------------------------
- name: "【戰役一】在 lab1 部署 Bastion 網管中心"
  hosts: lab1
  gather_facts: no
  become: true
  vars_files:
    - ../configuration/instance-setting.yaml

  tasks:
    - name: "1. 停止並停用 systemd-resolved 服務 (避免 port 53 衝突)"
      ansible.builtin.systemd:
        name: systemd-resolved
        state: stopped
        enabled: false
      failed_when: false

    - name: "2. 重置 resolv.conf 確保實體機能連外網"
      ansible.builtin.copy:
        dest: /etc/resolv.conf
        content: "nameserver 8.8.8.8\n"
        mode: '0644'

    - name: "3. 建立 Bastion 專屬配置目錄"
      ansible.builtin.file:
        path: /opt/okd-infra
        state: directory
        mode: '0755'

    - name: "4. 📝 渲染並寫入 dnsmasq.conf 設定檔"
      ansible.builtin.template:
        src: ../templates/dnsmasq.conf.j2
        dest: /opt/okd-infra/dnsmasq.conf
        mode: '0644'

    - name: "5. 📝 渲染並寫入 haproxy.cfg 設定檔"
      ansible.builtin.template:
        src: ../templates/haproxy.cfg.j2
        dest: /opt/okd-infra/haproxy.cfg
        mode: '0644'

    - name: "6. 📦 複製 docker-compose.yaml 到 lab1"
      ansible.builtin.copy:
        src: docker-compose.yaml
        dest: /opt/okd-infra/docker-compose.yaml
        mode: '0644'

    - name: "7. 🚀 在 lab1 啟動 Bastion 雙擎 (Docker Compose)"
      community.docker.docker_compose_v2:
        project_src: /opt/okd-infra
        state: present

# ---------------------------------------------------------------------
# 【戰役二】在 lab1 自動下載標準 ISO 並建立 KVM 大腦虛擬機
# ---------------------------------------------------------------------
- name: "【戰役二】在 lab1 建立並啟動 OKD 大腦虛擬機"
  hosts: lab1
  gather_facts: no
  become: true
  vars_files:
    - ../configuration/instance-setting.yaml

  tasks:
    - name: "1.5 🛡️ 解除 AppArmor/SELinux 限制：允許 QEMU 讀取自訂外掛韌體"
      ansible.builtin.lineinfile:
        path: /etc/libvirt/qemu.conf
        regexp: '^#?\s*security_driver\s*=\s*.*'
        line: 'security_driver = "none"'
      register: qemu_security_config

    - name: "1.6 🔄 重啟 libvirtd 服務以強制套用安全設定"
      ansible.builtin.systemd:
        name: libvirtd
        state: restarted
      when: qemu_security_config.changed

    - name: "2. 📥 自動下載官方 FCOS QEMU 映像檔 (取代 Live ISO)"
      ansible.builtin.get_url:
        url: "https://builds.coreos.fedoraproject.org/prod/streams/stable/builds/41.20241109.3.0/x86_64/fedora-coreos-41.20241109.3.0-qemu.x86_64.qcow2.xz"
        dest: /var/lib/libvirt/images/fcos.qcow2.xz
        mode: '0644'

    - name: "2.1 📦 解壓縮 QCOW2 映像檔"
      ansible.builtin.command:
        # 加上 -k (keep) 保留原壓縮檔，確保 Ansible 再次執行時不會重複下載
        cmd: "unxz -k -f /var/lib/libvirt/images/fcos.qcow2.xz"
      args:
        # 如果解壓後的檔案已存在，就跳過此步驟
        creates: /var/lib/libvirt/images/fcos.qcow2

    - name: "3. 🛸 把身分證上傳到 lab1 (Master & Bootstrap)"
      ansible.builtin.copy:
        src: "../templates/{{ item }}"
        dest: "/var/lib/libvirt/images/{{ item }}"
        mode: '0644'
      loop:
        - master.ign
        - bootstrap.ign

    # --- Bootstrap 專區 (永遠只有 1 台，不需要迴圈) ---
    - name: "4. 🛠️ 建立 Bootstrap 虛擬機專屬硬碟"
      ansible.builtin.command:
        cmd: "qemu-img create -f qcow2 -F qcow2 -b /var/lib/libvirt/images/fcos.qcow2 /var/lib/libvirt/images/{{ bootstrap.vm_name }}.qcow2 {{ bootstrap.vm_disk_size }}G"
      args:
        creates: "/var/lib/libvirt/images/{{ bootstrap.vm_name }}.qcow2"

    - name: "4.1 🛠️ 批次建立 Control Node 虛擬機專屬硬碟"
      ansible.builtin.command:
        cmd: "qemu-img create -f qcow2 -F qcow2 -b /var/lib/libvirt/images/fcos.qcow2 /var/lib/libvirt/images/{{ item.vm_name }}.qcow2 {{ item.vm_disk_size }}G"
      args:
        creates: "/var/lib/libvirt/images/{{ item.vm_name }}.qcow2"
      loop: "{{ controlNodes.hosts }}" # <--- 直接吃整個 List！

    - name: "5. 🔐 設定基礎映像檔、Bootstrap 與身分證的存取權限"
      ansible.builtin.file:
        path: "/var/lib/libvirt/images/{{ item }}"
        owner: libvirt-qemu
        group: kvm
        mode: '0644'
      loop:
        - fcos.qcow2
        - master.ign
        - bootstrap.ign
        - "{{ bootstrap.vm_name }}.qcow2"

    - name: "5.1 🔐 批次設定 Control Node 虛擬硬碟存取權限"
      ansible.builtin.file:
        path: "/var/lib/libvirt/images/{{ item.vm_name }}.qcow2"
        owner: libvirt-qemu
        group: kvm
        mode: '0644'
      loop: "{{ controlNodes.hosts }}"

    - name: "6. 📝 定義 Bootstrap 虛擬機"
      community.libvirt.virt:
        name: "{{ bootstrap.vm_name }}"
        command: define
        xml: "{{ lookup('template', '../templates/bootstrap.xml.j2') }}"
        autostart: true

    - name: "7. ⚡ 啟動 Bootstrap 虛擬機"
      community.libvirt.virt:
        name: "{{ bootstrap.vm_name }}"
        state: running

    - name: "6.1 📝 批次定義 Control Node 虛擬機"
      community.libvirt.virt:
        name: "{{ item.vm_name }}"
        command: define
        # 把 item 傳進去給 template 渲染
        xml: "{{ lookup('template', '../templates/control.xml.j2', template_vars={'item': item}) }}"
        autostart: true
      loop: "{{ controlNodes.hosts }}"

    - name: "7.1 ⚡ 批次啟動 Control Node 虛擬機"
      community.libvirt.virt:
        name: "{{ item.vm_name }}"
        state: running
      loop: "{{ controlNodes.hosts }}"
